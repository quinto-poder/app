<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <title>Teste de Estresse Epistêmico - Sistema de Ponderação Epistêmica</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- @file StressTest.html -->
  <!-- @description Interface para o teste de estresse epistêmico com gamificação. -->
  <!-- @module Módulo4_Gamificacao -->
  <!-- @author Manus AI -->
  <!-- @version 1.0.0 -->
  <!-- @date 2026-03-14 -->
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eef2f7;
      padding: 20px;
      color: #333;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      max-width: 900px;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }

    .fact-card {
      background: #fff;
      border: 1px solid #dcdde1;
      border-radius: 8px;
      margin-bottom: 20px;
      padding: 20px;
      transition: transform 0.2s;
    }

    .fact-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .fact-text {
      font-size: 1.1em;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .slider-container input {
      flex-grow: 1;
      height: 8px;
      border-radius: 5px;
      background: #dcdde1;
      outline: none;
      transition: background 0.3s;
    }

    .slider-container input:hover {
      background: #bdc3c7;
    }

    .weight-label {
      font-weight: bold;
      font-size: 1.2em;
      color: #3498db;
      width: 30px;
      text-align: center;
    }

    .gravity-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85em;
      color: #7f8c8d;
      margin-top: 5px;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1em;
      font-weight: bold;
      margin-top: 30px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #2980b9;
    }

    #result {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }

    .badge {
      font-size: 1.5em;
      font-weight: bold;
      color: #f1c40f;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Teste de Estresse Epistêmico: Escândalo Banco Master</h2>
    <p style="text-align: center; color: #7f8c8d; margin-bottom: 30px;">
      Avalie a gravidade sistêmica de cada fato isolado de 1 a 10.
    </p>
    <div id="facts-container">
      <!-- Fatos carregados dinamicamente -->
    </div>
    <button onclick="calculateResults()">Finalizar Auditoria de Viés</button>
    <div id="result">
      <h3>Seu Resultado:</h3>
      <div id="score-text"></div>
      <div id="badge-text" class="badge"></div>
    </div>
  </div>

  <script>
    var currentFacts = [];

    window.onload = function () {
      google.script.run.withSuccessHandler(renderFacts).generateTest('USER_UUID');
    };

    function renderFacts(facts) {
      currentFacts = facts;
      var container = document.getElementById('facts-container');
      facts.forEach(function (f, index) {
        var card = document.createElement('div');
        card.className = 'fact-card';
        card.innerHTML = `
          <div class="fact-text">${f.text}</div>
          <div class="slider-container">
            <span>Baixa</span>
            <input type="range" id="f_${index}" min="1" max="10" value="5" oninput="updateLabel(${index}, this.value)">
            <span>Alta</span>
            <div class="weight-label" id="l_${index}">5</div>
          </div>
          <div class="gravity-labels">
            <span>Irrelevante</span>
            <span>Gravidade Sistêmica</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateLabel(index, value) {
      document.getElementById('l_' + index).innerText = value;
    }

    function calculateResults() {
      var answers = currentFacts.map(function (f, index) {
        return {
          id: f.id,
          userWeight: parseInt(document.getElementById('f_' + index).value, 10),
          ideology: f.ideology
        };
      });

      google.script.run.withSuccessHandler(showResults).processTestResults('USER_UUID', answers);
    }

    function showResults(result) {
      if (!result) { alert("Falha ao calcular a auditoria. Confirme sua conectividade e tente novamente."); return; }
      var resultDiv = document.getElementById('result');
      var scoreText = document.getElementById('score-text');
      var badgeText = document.getElementById('badge-text');

      resultDiv.style.display = 'block';
      scoreText.innerHTML = `Seu Score de Viés: <strong>${result.score}</strong>`;
      badgeText.innerText = `Badge Desbloqueado: ${result.badge}`;
      resultDiv.style.backgroundColor = result.score < 20 ? '#d4edda' : '#fff3cd';
    }
  </script>
</body>

</html>

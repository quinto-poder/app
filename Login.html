<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <title>Login - Sistema de Ponderação Epistêmica</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- @file Login.html -->
  <!-- @description Interface de usuário para o login no sistema. -->
  <!-- @module Módulo1_Autenticacao -->
  <!-- @author Manus AI -->
  <!-- @version 1.0.0 -->
  <!-- @date 2026-03-14 -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 300px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #message {
      text-align: center;
      color: red;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Usuário">
    <input type="password" id="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <div id="message"></div>
  </div>

  <script>
    function login() {
      var user = document.getElementById('username').value;
      var pass = document.getElementById('password').value;
      google.script.run.withSuccessHandler(function (response) {
        if (response.success) {
          window.location.href = '<?= ScriptApp.getService().getUrl() ?>?page=dashboard';
        } else {
          document.getElementById('message').innerText = response.message || 'Credenciais inválidas.';
        }
      }).validateLogin(user, pass);
    }
  </script>
</body>

</html>
